
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-lissfnulx77znhtq.us.auth0.com/
          audiences:
            - "https://hotel-microservices-api"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
